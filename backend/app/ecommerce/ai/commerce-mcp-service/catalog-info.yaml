apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: commerce-mcp-service
  description: MCP server cho agentic commerce (tìm sản phẩm, giỏ hàng, đơn hàng thay khách; OAuth scope + OpenFGA)
  tags:
  - python
  - mcp
  annotations:
    github.com/project-slug: pdcthanh112/CongThanhApp
    backstage.io/source-location: url:https://github.com/pdcthanh112/CongThanhApp/tree/main/backend/app/ecommerce/ai/commerce-mcp-service
