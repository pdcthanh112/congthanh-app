# Nguồn sự thật duy nhất cho định tuyến north-south (thay api-gateway Go cũ).
# Sinh cấu hình APISIX bằng:  python3 services/api-gateway/scripts/gen-routes.py
#   → services/api-gateway/apisix/apisix.yaml    (standalone, dùng cho deploy/local)
#   → services/api-gateway/k8s/routes.yaml       (ApisixRoute CRD cho cluster)
#
# auth: required  → plugin openid-connect (Keycloak, bearer_only) chặn request thiếu/sai token
#       optional  → không chặn ở gateway; service tự xác thực JWT nếu có
# host/port: tên service trong docker compose / K8s Service (port 80 trong cluster).
# Mọi service REST phục vụ dưới /api/ecommerce/... nên đường dẫn được chuyển nguyên vẹn.
# exact: true   → khớp đúng đường dẫn (không thêm *)
# websocket     → cho phép nâng cấp WebSocket (GraphQL subscription)
# priority      → route trùng tiền tố thì số lớn hơn được xét trước (mặc định 0)
# rewrite       → đổi đường dẫn trước khi chuyển tới upstream
# catalog, customer, review, notification, message (NestJS) chỉ phục vụ GraphQL qua router, không có route REST.
keycloak:
  discovery: http://keycloak:8080/realms/ecommerce/.well-known/openid-configuration
  client_id: apisix-gateway
defaults:
  rate_limit: {count: 300, window: 60}   # mỗi IP / phút
routes:
  - {name: cart,         service: cart-service,         port: 5002, auth: required, paths: [/api/ecommerce/carts]}
  - {name: inventory,    service: inventory-service,    port: 5014, paths: [/api/ecommerce/inventory, /api/ecommerce/warehouses]}
  - name: flash-sale
    service: inventory-service
    port: 5014
    auth: required
    paths: [/api/ecommerce/flash-sales]
    # Bảo vệ đợt flash sale: tối đa 10 lượt / 10s mỗi người dùng (đủ cho việc hỏi vị trí trong phòng chờ mỗi 2 giây
    # cộng vài lượt giành), 2000 kết nối đồng thời toàn route.
    rate_limit: {count: 10, window: 10, key: consumer}
    max_conn: 2000
  - {name: order,        service: order-service,        port: 5006, auth: required, paths: [/api/ecommerce/orders, /api/ecommerce/checkout]}
  # Phiên checkout mới (/checkout/sessions) đi checkout-service; POST /checkout cũ vẫn ở order-service.
  # Giới hạn theo người dùng để một client lỗi/bot không chiếm hết lượt đặt đơn lúc cao điểm; quá 1500 kết nối đồng
  # thời thì gateway trả 503 ngay thay vì dồn hết xuống checkout-service.
  - name: checkout
    service: checkout-service
    port: 5027
    auth: required
    priority: 10
    paths: [/api/ecommerce/checkout/sessions]
    rate_limit: {count: 30, window: 10, key: consumer}
    max_conn: 1500
  - {name: pricing,      service: pricing-service,      port: 5025, paths: [/api/ecommerce/pricing]}
  # Chỉ API duyệt tay (ADMIN/FRAUD_ANALYST); /internal/fraud/assess không mở ra ngoài.
  - {name: fraud,        service: fraud-service,        port: 5026, auth: required, paths: [/api/ecommerce/fraud]}
  - {name: recommendation, service: recommendation-service, port: 5028, paths: [/api/ecommerce/recommendations]}
  - {name: media,        service: media-service,        port: 5007, paths: [/api/ecommerce/media]}
  - {name: product,      service: product-service,      port: 5008, paths: [/api/ecommerce/products]}
  - {name: payment,      service: payment-service,      port: 5018, paths: [/api/ecommerce/payment]}
  - {name: promotion,    service: promotion-service,    port: 5009, paths: [/api/ecommerce/promotions]}
  - {name: search,       service: search-service,       port: 5013, paths: [/api/ecommerce/search]}
  - {name: supplier,     service: supplier-service,     port: 5019, paths: [/api/ecommerce/suppliers]}
  - {name: shipping,     service: shipping-service,     port: 5016, paths: [/api/ecommerce/shipping]}
  - name: translate
    service: translate-service
    port: 5017
    paths: [/api/ecommerce/translate]
    rate_limit: {count: 60, window: 60}
  - {name: tax,          service: tax-service,          port: 5022, paths: [/api/ecommerce/tax]}
  - {name: webhook,      service: webhook-service,      port: 5023, auth: required, paths: [/api/ecommerce/webhooks]}
  # ADR 0024: đổi trả, sổ cái (chỉ team tài chính, service kiểm role FINANCE), quyền riêng tư CCPA/CPRA.
  - {name: returns,      service: returns-service,      port: 5032, auth: required, paths: [/api/ecommerce/returns]}
  - {name: ledger,       service: ledger-service,       port: 5031, auth: required, paths: [/api/ecommerce/ledger]}
  - name: privacy
    service: privacy-service
    port: 5033
    auth: required
    paths: [/api/ecommerce/privacy]
    # Yêu cầu xem/xoá dữ liệu kéo theo việc của hàng chục service: giới hạn chặt theo người dùng.
    rate_limit: {count: 30, window: 60, key: consumer}
  # ADR 0025: store credit, tranh chấp thẻ, đối soát (service tự kiểm role FINANCE/SUPPORT/ADMIN).
  - {name: stored-value,   service: stored-value-service,   port: 5034, auth: required, paths: [/api/ecommerce/stored-value]}
  - {name: disputes,       service: dispute-service,        port: 5035, auth: required, paths: [/api/ecommerce/disputes]}
  # Webhook tranh chấp của Stripe: không có token người dùng, service kiểm chữ ký Stripe-Signature.
  - {name: disputes-webhook, service: dispute-service,      port: 5035, priority: 10, paths: [/api/ecommerce/disputes/webhooks/stripe], exact: true}
  - {name: reconciliation, service: reconciliation-service, port: 5036, auth: required, paths: [/api/ecommerce/reconciliation]}
  # ADR 0026: điểm thưởng, mua định kỳ, kiểm duyệt (/internal/moderation không định tuyến ra ngoài).
  - {name: loyalty,        service: loyalty-service,        port: 5037, auth: required, paths: [/api/ecommerce/loyalty]}
  - {name: subscriptions,  service: subscription-service,   port: 5038, auth: required, paths: [/api/ecommerce/subscriptions]}
  - {name: moderation,     service: moderation-service,     port: 5039, auth: required, paths: [/api/ecommerce/moderation]}
  - name: chatbot
    service: chatbot-service
    port: 5024
    paths: [/api/ecommerce/chatbot]
    # Gọi LLM tốn tiền: giới hạn chặt theo IP.
    rate_limit: {count: 20, window: 60}
  # MCP server cho AI agent: service tự trả 401 kèm resource_metadata (RFC 9728) để client MCP tìm Keycloak,
  # nên gateway không chặn token (plugin openid-connect trả 401 không có metadata, làm hỏng luồng OAuth của client).
  - name: commerce-mcp
    service: commerce-mcp-service
    port: 5030
    exact: true
    paths: [/api/ecommerce/mcp, /.well-known/oauth-protected-resource/api/ecommerce/mcp]
    rate_limit: {count: 120, window: 60}
  # GraphQL: Cosmo Router ghép supergraph; router và subgraph tự xác thực JWT nên không chặn ở gateway.
  - {name: graphql,       service: graphql-router,            port: 4000, exact: true, websocket: true, paths: [/graphql]}
  - name: graphql-admin
    service: graphql-router-backoffice
    port: 4000
    exact: true
    websocket: true
    rewrite: /graphql
    paths: [/admin/graphql]
    rate_limit: {count: 600, window: 60}
