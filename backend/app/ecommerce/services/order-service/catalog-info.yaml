apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: order-service
  description: Đơn hàng; chạy các bước saga checkout (activity) cho checkout-service
  tags:
  - java
  annotations:
    github.com/project-slug: pdcthanh112/CongThanhApp
    backstage.io/source-location: url:https://github.com/pdcthanh112/CongThanhApp/tree/main/backend/app/ecommerce/services/order-service
    argocd/app-selector: app.kubernetes.io/name=order-service
    grafana/dashboard-selector: tags @> 'order-service'
    backstage.io/techdocs-ref: dir:../../docs
spec:
  type: service
  lifecycle: production
  owner: team-ecommerce
  system: ecommerce
  providesApis:
  - order-api-grpc
  consumesApis:
  - inventory-api-grpc
  - product-api-grpc
  - cart-api-grpc
  dependsOn:
  - resource:ecommerce-postgres
  - resource:ecommerce-kafka
