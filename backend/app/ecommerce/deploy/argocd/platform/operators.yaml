# Flink Kubernetes Operator: quản lý FlinkDeployment (savepoint khi nâng cấp, autoscaler theo backlog Kafka).
# Webhook dùng chứng chỉ cert-manager (cài cùng wave). SA "flink" + RBAC được tạo trong namespace streaming.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-kubernetes-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-19"
spec:
  project: platform
  source:
    repoURL: https://downloads.apache.org/flink/flink-kubernetes-operator-1.16.1/
    chart: flink-kubernetes-operator
    targetRevision: 1.16.1
    helm:
      valuesObject:
        watchNamespaces: [streaming]
        jobServiceAccount: { create: true, name: flink }
        defaultConfiguration:
          create: true
          append: true
          flink-conf.yaml: |+
            kubernetes.operator.metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
            kubernetes.operator.metrics.reporter.prom.port: 9999
  destination:
    server: https://kubernetes.default.svc
    namespace: flink-operator
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# Kargo: promote Freight (bộ image) dev → staging → prod bằng commit/PR vào repo (platform/delivery/kargo).
# Đăng nhập UI bằng Keycloak (OIDC), tắt tài khoản admin mặc định.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-19"
spec:
  project: platform
  source:
    repoURL: ghcr.io/akuity/kargo-charts
    chart: kargo
    targetRevision: 1.12.4
    helm:
      valuesObject:
        api:
          adminAccount: { enabled: false }
          oidc:
            enabled: true
            issuerURL: https://auth.congthanh.vn/realms/ecommerce
            clientID: kargo
            admins: { claims: { groups: [platform-admins] } }
        controller:
          argocd: { integrationEnabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# Tetragon: runtime security bằng eBPF (TracingPolicy ở platform/security/tetragon).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetragon
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: platform
  sources:
    - repoURL: https://helm.cilium.io
      chart: tetragon
      targetRevision: 1.7.1
      helm:
        valueFiles:
          - $values/backend/app/ecommerce/platform/security/tetragon/values.yaml
    - repoURL: https://github.com/pdcthanh112/CongThanhApp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
