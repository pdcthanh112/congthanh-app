apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.40.*
    helm:
      valuesObject:
        dashboard: { enabled: true }
        controller:
          initContainers:
            - name: copy-gwapi-plugin
              image: ghcr.io/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi:v0.17.0
              command: ["/bin/sh", "-c"]
              args: ["cp /bin/rollouts-plugin-trafficrouter-gatewayapi /plugins"]
              volumeMounts: [{ name: gwapi-plugin, mountPath: /plugins }]
          trafficRouterPlugins:
            - name: argoproj-labs/gatewayAPI
              location: file:///plugins/rollouts-plugin-trafficrouter-gatewayapi
          volumes: [{ name: gwapi-plugin, emptyDir: {} }]
          volumeMounts: [{ name: gwapi-plugin, mountPath: /plugins }]
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
