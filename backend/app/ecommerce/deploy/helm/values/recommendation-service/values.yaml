# recommendation-service: gợi ý sản phẩm (FastAPI + pgvector). Ghi đè theo môi trường ở values-<env>.yaml.
nameOverride: recommendation-service
runtime: python
image:
  repository: ghcr.io/pdcthanh112/congthanhapp/recommendation-service
ports:
  http: 5028
env:
  DB_SCHEMA: recommendation
  KAFKA_BROKERS: ecommerce-kafka-bootstrap.messaging.svc.cluster.local:9092
  JWT_JWKS_URL: http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/certs
  # Cluster CNPG đã bật extension vector (platform/data/postgres-cnpg.yaml).
  VECTOR_ENABLED: "true"
  EMBEDDINGS_PROVIDER: hashing
  EMBEDDING_DIM: "256"
secretEnv:
- name: DATABASE_URL
  key: ecommerce/recommendation-service
  property: database_url
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}
