# search-service: giá trị chung mọi môi trường. Ghi đè theo môi trường ở values-<env>.yaml.
nameOverride: search-service
runtime: go
image:
  repository: ghcr.io/pdcthanh112/congthanhapp/search-service
ports:
  http: 5013
  grpc: 9098
env:
  KAFKA_BROKERS: ecommerce-kafka-bootstrap.messaging.svc.cluster.local:9092
  ELASTICSEARCH_INDEX: products
  JWT_JWKS_URL: http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/certs
secretEnv:
# Elastic Cloud (infra/terraform/modules/elastic-cloud): URL PrivateLink theo từng môi trường (output
# elasticsearch_private_url) và API key chỉ có quyền trên chỉ mục products, lưu ở Vault.
- name: ELASTICSEARCH_URL
  key: ecommerce/search-service
  property: elasticsearch_url
- name: ELASTICSEARCH_API_KEY
  key: ecommerce/search-service
  property: elasticsearch_api_key
keda:
  enabled: true
  kafka:
    consumerGroup: search-service
    topic: ecommerce.product.events
