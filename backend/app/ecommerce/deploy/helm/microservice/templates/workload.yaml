{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "ms.name" . }}
  labels: {{- include "ms.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.autoscaling.enabled .Values.keda.enabled) }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "ms.selector" . | nindent 6 }}
  template:
    {{- include "ms.podTemplate" . | nindent 4 }}
  {{- if .Values.rollout.enabled }}
  strategy:
    canary:
      stableService: {{ include "ms.name" . }}
      canaryService: {{ include "ms.name" . }}-canary
      {{- if eq .Values.rollout.trafficRouting "gatewayAPI" }}
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            namespace: {{ .Release.Namespace }}
            httpRoutes:
              - {name: {{ include "ms.name" . }}, useHeaderRoutes: true}
            {{- if .Values.ports.grpc }}
            grpcRoutes:
              - {name: {{ include "ms.name" . }}-grpc, useHeaderRoutes: false}
            {{- end }}
      {{- end }}
      {{- if .Values.rollout.sloBurn.enabled }}
      analysis:
        startingStep: 1
        templates:
          - {templateName: slo-burn-rate, clusterScope: true}
        args:
          - {name: service-name, value: {{ include "ms.name" . }}}
          - {name: objective, value: {{ .Values.rollout.sloBurn.objective | quote }}}
          - {name: burn-rate-limit, value: {{ .Values.rollout.sloBurn.burnRateLimit | quote }}}
      {{- end }}
      steps:
        {{- tpl (toYaml .Values.rollout.steps) . | nindent 8 }}
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 25%, maxUnavailable: 0}
  {{- end }}
