server:
  applicationConnectors:
    - type: http
      port: 5000
      httpCompliance: RFC7230_LEGACY
  adminConnectors:
    - type: http
      port: 5001

db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://postgres:5432/marquez
  user: postgres
  password: postgres

migrateOnStartup: true

graphql:
  enabled: true

search:
  enabled: false

logging:
  level: INFO
  appenders:
    - type: console
