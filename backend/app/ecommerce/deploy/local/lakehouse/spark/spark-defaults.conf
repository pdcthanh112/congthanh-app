# Catalog Iceberg "lakehouse" qua Polaris REST, file dữ liệu trên MinIO (S3FileIO). Key chỉ dùng local.
spark.master                                        local[*]
spark.sql.extensions                                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                            lakehouse
spark.sql.catalog.lakehouse                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                    rest
spark.sql.catalog.lakehouse.uri                     http://polaris:8181/api/catalog
spark.sql.catalog.lakehouse.warehouse               lakehouse
spark.sql.catalog.lakehouse.rest.auth.type          oauth2
spark.sql.catalog.lakehouse.credential              root:s3cr3t
spark.sql.catalog.lakehouse.scope                   PRINCIPAL_ROLE:ALL
spark.sql.catalog.lakehouse.oauth2-server-uri       http://polaris:8181/api/catalog/v1/oauth/tokens
spark.sql.catalog.lakehouse.token-refresh-enabled   true
spark.sql.catalog.lakehouse.io-impl                 org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint             http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access    true
spark.sql.catalog.lakehouse.s3.access-key-id        minioadmin
spark.sql.catalog.lakehouse.s3.secret-access-key    minioadmin
spark.sql.catalog.lakehouse.client.region           us-east-1
# Polaris không cho principal root gửi metrics (REPORT_WRITE_METRICS); tắt để log khỏi lỗi Forbidden.
spark.sql.catalog.lakehouse.rest-metrics-reporting-enabled  false

spark.sql.session.timeZone                          UTC
spark.sql.shuffle.partitions                        8
spark.sql.adaptive.enabled                          true
spark.ui.showConsoleProgress                        false
