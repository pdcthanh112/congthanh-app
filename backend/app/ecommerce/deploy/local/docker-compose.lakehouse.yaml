# Data lakehouse local: Kafka → Spark → Iceberg (MinIO) ← Trino, điều phối bằng Airflow.
# File này GHÉP thêm vào docker-compose.yaml (cùng project, cùng network), không chạy riêng:
#   make lakehouse-up                       # = profile lakehouse (+ minio)
#   make lakehouse-up LAKEHOUSE_PROFILES="lakehouse airflow"
# Đường dẫn tương đối tính từ deploy/local (thư mục của file compose đầu tiên).
# Kiến trúc và lý do chọn: docs/adr/0013-data-lakehouse.md. Code job: data/lakehouse.
#
# Tầng dữ liệu (namespace trong catalog Iceberg "lakehouse"):
#   bronze  event thô từ Kafka, chỉ append (outbox, CDC, clickstream)
#   ods     bản sao trạng thái hiện tại của bảng OLTP, MERGE gần thời gian thực từ CDC
#   silver  dữ liệu đã làm sạch, khử trùng lặp, bỏ PII, chuẩn kiểu
#   gold    bảng tổng hợp cho BI/ML (doanh thu, funnel, RFM)
x-lake-spark: &lake-spark
  build: ./lakehouse/spark
  image: congthanhapp/lakehouse-spark:4.0.1-iceberg1.12.0
  environment: &lake-spark-env
    AWS_REGION: us-east-1
    LAKE_TRIGGER_SECONDS: ${LAKE_TRIGGER_SECONDS:-30}
  volumes:
    - ../../data/lakehouse/jobs:/opt/lakehouse/jobs:ro
  depends_on:
    polaris-init: {condition: service_completed_successfully}
    kafka: {condition: service_healthy}

services:
  # MinIO đã có trong profile apps-go; bật thêm cho lakehouse.
  minio:
    profiles: [apps-go, lakehouse]

  # Bucket chứa dữ liệu Iceberg (metadata + file Parquet).
  lakehouse-bucket:
    profiles: [lakehouse]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/lakehouse
    restart: "no"

  # Database cho Polaris và Airflow (init.sql chỉ chạy khi volume Postgres mới tạo, nên tạo ở đây).
  lakehouse-db-init:
    profiles: [lakehouse]
    image: postgres:18
    depends_on: {postgres: {condition: service_healthy}}
    environment: {PGPASSWORD: postgres}
    entrypoint: ["sh", "-c"]
    command:
      - |
        for db in polaris airflow; do
          psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1 \
            || psql -h postgres -U postgres -c "CREATE DATABASE $$db"
        done
        # Polaris ghi bảng vào schema polaris_schema nhưng không tự tạo schema.
        psql -h postgres -U postgres -d polaris -c "CREATE SCHEMA IF NOT EXISTS polaris_schema"
    restart: "no"

  # ---------------- catalog Iceberg: Apache Polaris (REST catalog) ----------------
  polaris-bootstrap:
    profiles: [lakehouse]
    image: apache/polaris-admin-tool:1.8.0
    depends_on: {lakehouse-db-init: {condition: service_completed_successfully}}
    environment: &polaris-db
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
    # Tạo bảng của Polaris + realm POLARIS + principal root (client_id:secret = root:s3cr3t, CHỈ dùng local).
    # Idempotent: realm đã bootstrap thì công cụ bỏ qua.
    command: ["bootstrap", "-r", "POLARIS", "-c", "POLARIS,root,s3cr3t"]
    restart: "no"

  polaris:
    profiles: [lakehouse]
    image: apache/polaris:1.8.0
    ports: ["8181:8181", "8182:8182"]
    environment:
      <<: *polaris-db
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # Polaris tự ghi metadata vào MinIO bằng key này (MinIO local không có STS để cấp quyền tạm).
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"S3\",\"FILE\"]"
      polaris.readiness.ignore-severe-issues: "true"
    depends_on:
      polaris-bootstrap: {condition: service_completed_successfully}
      lakehouse-bucket: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8182/q/health"]
      interval: 5s
      retries: 30

  # Tạo catalog "lakehouse" trỏ vào s3://lakehouse (idempotent).
  polaris-init:
    profiles: [lakehouse]
    image: curlimages/curl:8.16.0
    depends_on: {polaris: {condition: service_healthy}}
    volumes: ["./lakehouse/polaris/init.sh:/init.sh:ro"]
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  # ---------------- Spark ----------------
  # Spark Connect server: Airflow và notebook gọi vào sc://spark-connect:15002 để chạy job batch.
  spark-connect:
    <<: *lake-spark
    profiles: [lakehouse]
    ports: ["15002:15002", "4042:4040"]  # 4040 là của Pyroscope
    environment:
      <<: *lake-spark-env
      SPARK_NO_DAEMONIZE: "true"
    command: ["/opt/spark/sbin/start-connect-server.sh", "--driver-memory", "1g"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/15002'"]
      interval: 10s
      retries: 30

  # Job streaming chạy liên tục: Kafka → bronze (append) và CDC → ods (MERGE).
  lake-stream:
    <<: *lake-spark
    profiles: [lakehouse]
    ports: ["4041:4040"]
    command: ["/opt/spark/bin/spark-submit", "--driver-memory", "1g", "/opt/lakehouse/jobs/stream_ingest.py"]
    volumes:
      - ../../data/lakehouse/jobs:/opt/lakehouse/jobs:ro
      - lake-checkpoints:/checkpoints
    restart: unless-stopped

  # ---------------- Trino: SQL trên Iceberg ----------------
  trino:
    profiles: [lakehouse]
    image: trinodb/trino:478
    ports: ["8088:8080"]
    volumes: ["./lakehouse/trino/catalog:/etc/trino/catalog:ro"]
    depends_on: {polaris-init: {condition: service_completed_successfully}}

  # ---------------- nguồn dữ liệu ----------------
  # CDC bảng nghiệp vụ (orders, order_lines, payments, products) → topic ods.<schema>.<bảng>.
  # Cần profile apps-java để có bảng; script tự thử lại tới khi connector chạy được.
  connect-init-lakehouse:
    profiles: [lakehouse]
    image: curlimages/curl:8.16.0
    depends_on: {connect: {condition: service_healthy}, schema-registry: {condition: service_started}}
    volumes:
      - ../../platform/messaging/debezium/local/ods-cdc.json:/connectors/ods-cdc.json:ro
      - ../../api/jsonschema/clickstream/v1/clickstream-event.json:/schemas/clickstream-event.json:ro
      - ./lakehouse/connect-init.sh:/connect-init.sh:ro
    entrypoint: ["sh", "/connect-init.sh"]
    restart: "no"

  # Thu thập clickstream (view, search, add-to-cart...) từ web/app → topic clickstream.events.
  clickstream-collector:
    profiles: [lakehouse]
    build: {context: ../.., dockerfile: data/ingestion/clickstream-collector/Dockerfile}
    ports: ["5029:5029"]
    environment:
      KAFKA_BROKERS: kafka:9092
      CLICKSTREAM_TOPIC: clickstream.events
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      IP_HASH_SALT: local-dev-salt
      LOG_FORMAT: text
    depends_on: {kafka: {condition: service_healthy}}

  # ---------------- Airflow (profile airflow, nặng ~1.5 GB RAM) ----------------
  airflow:
    profiles: [airflow]
    build: ./lakehouse/airflow
    image: congthanhapp/lakehouse-airflow:3.1.2
    command: ["standalone"]
    ports: ["8090:8080"]  # 8089 là của OpenFGA
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Local: ai vào UI cũng là admin, không cần đăng nhập.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      SPARK_REMOTE: sc://spark-connect:15002
      LAKEHOUSE_JOBS_DIR: /opt/lakehouse/jobs
    volumes:
      - ../../data/lakehouse/airflow/dags:/opt/airflow/dags:ro
      - ../../data/lakehouse/jobs:/opt/lakehouse/jobs:ro
    depends_on:
      lakehouse-db-init: {condition: service_completed_successfully}
      spark-connect: {condition: service_healthy}

volumes:
  lake-checkpoints: {}
