# Trang Swagger UI chung cho môi trường local (http://localhost:8099).
# - /specs/static/*.yaml: spec viết tay trong api/openapi (service Go).
# - /specs/live/<tên>.json: proxy tới spec do service tự sinh (springdoc, FastAPI, drf-spectacular), cùng origin nên
#   không vướng CORS; service chưa chạy thì trả 502 và Swagger UI báo lỗi riêng spec đó.
# - /api/: proxy sang APISIX để nút "Try it out" gọi qua gateway như client thật.
# Hostname phân giải lúc có request (resolver của Docker) để nginx vẫn khởi động khi chỉ bật một phần stack.

map $spec_name $spec_url {
    default                "";
    product-service        http://product-service:5008/v3/api-docs;
    order-service          http://order-service:5006/v3/api-docs;
    payment-service        http://payment-service:5018/v3/api-docs;
    promotion-service      http://promotion-service:5009/v3/api-docs;
    checkout-service       http://checkout-service:5027/v3/api-docs;
    ledger-service         http://ledger-service:5031/v3/api-docs;
    returns-service        http://returns-service:5032/v3/api-docs;
    stored-value-service   http://stored-value-service:5034/v3/api-docs;
    dispute-service        http://dispute-service:5035/v3/api-docs;
    loyalty-service        http://loyalty-service:5037/v3/api-docs;
    subscription-service   http://subscription-service:5038/v3/api-docs;
    supplier-service       http://supplier-service:5019/api/ecommerce/suppliers/openapi.json;
    fraud-service          http://fraud-service:5026/api/ecommerce/fraud/openapi.json;
    chatbot-service        http://chatbot-service:5024/api/ecommerce/chatbot/openapi.json;
    recommendation-service http://recommendation-service:5028/api/ecommerce/recommendations/openapi.json;
    translate-service      http://translate-service:5017/api/ecommerce/translate/openapi.json;
    moderation-service     http://moderation-service:5039/api/ecommerce/moderation/openapi.json;
    reconciliation-service http://reconciliation-service:5036/api/ecommerce/reconciliation/openapi.json;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /specs/static/ {
        alias /specs/;
        types { application/yaml yaml; }
    }

    location ~ ^/specs/live/(?<spec_name>[a-z-]+)\.json$ {
        if ($spec_url = "") {
            return 404;
        }
        # Giữ Host gốc để springdoc ghi server URL là http://localhost:8099 (Try it out đi qua /api/ bên dưới).
        proxy_set_header Host $http_host;
        proxy_pass $spec_url;
    }

    location /api/ {
        set $gateway http://apisix:9080;
        proxy_set_header Host $http_host;
        proxy_pass $gateway;
    }
}
