[project]
name = "ecommerce-proto"
version = "0.1.0"
description = "Python protobuf sinh từ api/proto (event envelope, Money, *_events). Sinh lại: ./generate.sh"
requires-python = ">=3.13"
dependencies = ["protobuf==7.36.2"]

[tool.uv]
exclude-newer = "2026-10-27T00:00:00Z"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce"]
