asyncapi: 3.0.0
info:
  title: CongThanhApp e-commerce events
  version: 1.0.0
  description:
    Event miền trên Kafka. Mỗi record là ecommerce.common.v1.EventEnvelope
    (Protobuf) bọc event trong `payload` (Any). Header ce_type = tên đầy đủ của event,
    traceparent = W3C trace context. Key = aggregate id.
defaultContentType: application/x-protobuf
servers:
  local:
    host: localhost:29092
    protocol: kafka
  prod:
    host: ecommerce-kafka-bootstrap.messaging.svc.cluster.local:9092
    protocol: kafka
    security:
      - type: scramSha512
channels:
  cartEvents:
    address: ecommerce.cart.events
    messages:
      CartItemAdded:
        $ref: "#/components/messages/cart.CartItemAdded"
      CartItemRemoved:
        $ref: "#/components/messages/cart.CartItemRemoved"
      CartCleared:
        $ref: "#/components/messages/cart.CartCleared"
    description: "Event của cart-service; DLQ: ecommerce.cart.events.dlq"
  catalogEvents:
    address: ecommerce.catalog.events
    messages:
      CategoryUpserted:
        $ref: "#/components/messages/catalog.CategoryUpserted"
      BrandUpserted:
        $ref: "#/components/messages/catalog.BrandUpserted"
      ProductTagsChanged:
        $ref: "#/components/messages/catalog.ProductTagsChanged"
    description: "Event của catalog-service; DLQ: ecommerce.catalog.events.dlq"
  customerEvents:
    address: ecommerce.customer.events
    messages:
      WishlistItemAdded:
        $ref: "#/components/messages/customer.WishlistItemAdded"
      WishlistItemRemoved:
        $ref: "#/components/messages/customer.WishlistItemRemoved"
    description: "Event của customer-service; DLQ: ecommerce.customer.events.dlq"
  fraudEvents:
    address: ecommerce.fraud.events
    messages:
      FraudReviewRequested:
        $ref: "#/components/messages/fraud.FraudReviewRequested"
      FraudReviewDecided:
        $ref: "#/components/messages/fraud.FraudReviewDecided"
    description: "Event của fraud-service; DLQ: ecommerce.fraud.events.dlq"
  inventoryEvents:
    address: ecommerce.inventory.events
    messages:
      InventoryReserved:
        $ref: "#/components/messages/inventory.InventoryReserved"
      InventoryReservationFailed:
        $ref: "#/components/messages/inventory.InventoryReservationFailed"
      InventoryReleased:
        $ref: "#/components/messages/inventory.InventoryReleased"
      InventoryCommitted:
        $ref: "#/components/messages/inventory.InventoryCommitted"
      StockLevelChanged:
        $ref: "#/components/messages/inventory.StockLevelChanged"
      LowStockDetected:
        $ref: "#/components/messages/inventory.LowStockDetected"
      FlashSaleClaimed:
        $ref: "#/components/messages/inventory.FlashSaleClaimed"
    description: "Event của inventory-service; DLQ: ecommerce.inventory.events.dlq"
  messageEvents:
    address: ecommerce.message.events
    messages:
      MessageSent:
        $ref: "#/components/messages/message.MessageSent"
    description: "Event của message-service; DLQ: ecommerce.message.events.dlq"
  orderEvents:
    address: ecommerce.order.events
    messages:
      OrderPlaced:
        $ref: "#/components/messages/order.OrderPlaced"
      ShippingAddress:
        $ref: "#/components/messages/order.ShippingAddress"
      OrderConfirmed:
        $ref: "#/components/messages/order.OrderConfirmed"
      OrderCancelled:
        $ref: "#/components/messages/order.OrderCancelled"
    description: "Event của order-service; DLQ: ecommerce.order.events.dlq"
  paymentEvents:
    address: ecommerce.payment.events
