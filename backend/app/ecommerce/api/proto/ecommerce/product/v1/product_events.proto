syntax = "proto3";

package ecommerce.product.v1;

import "ecommerce/common/v1/money.proto";

option java_multiple_files = true;
option java_package = "com.congthanh.productservice.grpc";

message ProductUpserted {
  string product_id = 1;
  string sku = 2;
  string name = 3;
  string slug = 4;
  string category_id = 5;
  ecommerce.common.v1.Money price = 6;
  string status = 7;
  string parent_id = 8;
  bool has_variant = 9;
  int64 brand_id = 10;
  repeated string category_ids = 11;
  repeated AttributeValue attributes = 12;
  repeated VariantSummary variants = 13;
  repeated OptionValue options = 14;
  bool featured = 15;
}

message AttributeValue {
  string code = 1;
  string name = 2;
  string value = 3;
  optional double number = 4;
  string unit = 5;
  bool filterable = 6;
  bool searchable = 7;
}

message OptionValue {
  int64 option_id = 1;
  string option_name = 2;
  int64 value_id = 3;
  string value = 4;
}

message VariantSummary {
  string product_id = 1;
  string sku = 2;
  ecommerce.common.v1.Money price = 3;
  string status = 4;
  repeated OptionValue options = 5;
}

message ProductDeleted {
  string product_id = 1;
}
