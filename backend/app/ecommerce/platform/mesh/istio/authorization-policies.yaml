# /internal/fraud/assess chỉ checkout-service gọi được; API duyệt tay đi qua gateway/backoffice.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-fraud-service
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-service
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/ecommerce/sa/checkout-service
    to:
    - operation:
        paths:
        - '/internal/*'
  - from:
    - source:
        principals:
        - cluster.local/ns/ecommerce/sa/backoffice-bff
        - cluster.local/ns/gateway/sa/apisix
    to:
    - operation:
        notPaths:
        - '/internal/*'
  - from:
    - source:
        namespaces:
        - observability
    to:
    - operation:
        ports:
        - '9464'
        - '8080'
