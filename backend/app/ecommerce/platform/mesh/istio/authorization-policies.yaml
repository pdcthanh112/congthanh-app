# ADR 0027: checkout-service đọc sổ địa chỉ (gRPC) khi đặt đơn gia hạn subscription.
# Chỉ mở thêm đường này; các đường gọi customer-service khác (router GraphQL) khai ở policy riêng khi cần.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-checkout-to-customer-service
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-service
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/ecommerce/sa/checkout-service
    to:
    - operation:
        ports:
        - '19094'
