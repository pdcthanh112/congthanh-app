# Grafana Alloy (DaemonSet, eBPF), không cần sửa code ứng dụng:
#  - pyroscope.ebpf: CPU profiling mọi pod → Pyroscope.
#  - beyla.ebpf: tự đo RED (rate/error/duration) HTTP/gRPC/SQL/Redis/Kafka + service graph cho pod ecommerce/streaming;
#    bỏ qua service đã có OTel SDK (không trùng trace). Metrics → Mimir, trace → otel-collector.
#  - Log sự kiện Tetragon (runtime security) → Loki.
alloy:
  securityContext: {privileged: true, runAsUser: 0}
  mounts:
    varlog: true
  configMap:
    content: |
      discovery.kubernetes "pods" { role = "pod" }
      pyroscope.ebpf "default" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [pyroscope.write.backend.receiver]
      }
      pyroscope.write "backend" {
        endpoint { url = "http://pyroscope.observability.svc.cluster.local:4040" }
      }

      beyla.ebpf "default" {
        attributes {
          kubernetes { enable = "true" }
        }
        discovery {
          exclude_otel_instrumented_services = true
          instrument {
            kubernetes { namespace = "ecommerce" }
          }
          instrument {
            kubernetes { namespace = "streaming" }
          }
        }
        metrics {
          features = ["application", "application_service_graph"]
        }
        output {
          traces = [otelcol.exporter.otlp.collector.input]
        }
      }
      prometheus.scrape "beyla" {
        targets      = beyla.ebpf.default.targets
        honor_labels = true
        forward_to   = [prometheus.remote_write.mimir.receiver]
      }
      prometheus.remote_write "mimir" {
        endpoint { url = "http://lgtm-mimir-nginx.observability/api/v1/push" }
      }
      otelcol.exporter.otlp "collector" {
        client {
          endpoint = "otel-collector.observability.svc.cluster.local:4317"
          tls { insecure = true }
        }
      }

      // Sự kiện Tetragon (JSON) từ log container export-stdout của DaemonSet tetragon.
      discovery.relabel "tetragon" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_container_name"]
          regex         = "kube-system;tetragon;export-stdout"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }
      local.file_match "tetragon" { path_targets = discovery.relabel.tetragon.output }
      loki.source.file "tetragon" {
        targets    = local.file_match.tetragon.targets
        forward_to = [loki.process.tetragon.receiver]
      }
      loki.process "tetragon" {
        stage.static_labels { values = { app = "tetragon" } }
        forward_to = [loki.write.default.receiver]
      }
      loki.write "default" {
        endpoint { url = "http://lgtm-loki-gateway.observability/loki/api/v1/push" }
      }
controller: {type: daemonset, hostPID: true}
