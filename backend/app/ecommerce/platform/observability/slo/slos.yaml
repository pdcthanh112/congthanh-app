apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: pricing-latency
  namespace: observability
  labels:
    pyrra.dev/team: ecommerce
    pyrra.dev/runbook: slo-burn
spec:
  target: '95'
  window: 28d
  description: 95% yêu cầu tính giá xong dưới 100ms
  indicator:
    latency:
      success:
        metric: traces_span_metrics_duration_milliseconds_bucket{service_name="pricing-service",span_kind="SPAN_KIND_SERVER",le="100"}
      total:
        metric: traces_span_metrics_duration_milliseconds_count{service_name="pricing-service",span_kind="SPAN_KIND_SERVER"}
---
