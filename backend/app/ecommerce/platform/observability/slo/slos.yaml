# SLO khai báo cho Pyrra (operator ở platform/observability/pyrra sinh recording rule + cảnh báo burn rate vào Mimir).
# Chỉ số lấy từ span metrics của otel-collector, nên service nào có trace là đo được, không cần sửa code.
# Thêm SLO: thêm một document; chạy local thì sửa thêm platform/observability/prometheus/slo-rules.yaml.
apiVersion: pyrra.dev/v1alpha1
kind: ServiceLevelObjective
metadata:
  name: checkout-availability
  namespace: observability
  labels:
    pyrra.dev/team: ecommerce
    pyrra.dev/runbook: slo-burn
spec:
  target: '99.9'
  window: 28d
  description: Tạo/đặt phiên checkout (checkout-service) không lỗi
  indicator:
    ratio:
      errors:
        metric: traces_span_metrics_calls_total{service_name="checkout-service",http_route=~"/api/ecommerce/checkout/sessions.*",status_code="STATUS_CODE_ERROR"}
      total:
        metric: traces_span_metrics_calls_total{service_name="checkout-service",http_route=~"/api/ecommerce/checkout/sessions.*"}
---
