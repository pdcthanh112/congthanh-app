# SINH bằng tools/scripts/gen-kargo.py từ deploy/helm/values/* — đừng sửa tay.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: congthanhapp
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: congthanhapp
  namespace: congthanhapp
spec:
  promotionPolicies:
  - stageSelector:
      name: dev
    autoPromotionEnabled: true
  - stageSelector:
      name: staging
    autoPromotionEnabled: true
  - stageSelector:
      name: prod
    autoPromotionEnabled: false
---
apiVersion: kargo.akuity.io/v1alpha1
