apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: update-images
  namespace: congthanhapp
spec:
  vars:
  - name: env
  steps:
  - uses: git-clone
    config:
      repoURL: https://github.com/pdcthanh112/CongThanhApp.git
      checkout:
      - branch: main
        path: ./src
      author:
        name: kargo
        email: kargo@congthanhapp.local
  - uses: yaml-update
    as: update-backoffice-bff
    config:
      path: ./src/backend/app/ecommerce/deploy/helm/values/backoffice-bff/values-${{ vars.env }}.yaml
      updates:
      - key: image.tag
        value: ${{ imageFrom('ghcr.io/pdcthanh112/congthanhapp/backoffice-bff').Tag }}
      - key: image.digest
        value: ${{ imageFrom('ghcr.io/pdcthanh112/congthanhapp/backoffice-bff').Digest }}
  - uses: yaml-update
