---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: congthanhapp
  labels:
    environment: dev
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: services
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: env
        value: dev
      steps:
      - task:
          name: update-images
      - uses: git-push
        config:
          path: ./src
          targetBranch: main
  verification:
    analysisTemplates:
    - name: ecommerce-health
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: congthanhapp
  labels:
    environment: staging
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: services
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      vars:
      - name: env
        value: staging
      steps:
      - task:
          name: update-images
      - uses: git-push
        config:
          path: ./src
          targetBranch: main
  verification:
    analysisTemplates:
    - name: ecommerce-health
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: congthanhapp
  labels:
    environment: prod
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: services
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      vars:
      - name: env
        value: prod
      steps:
      - task:
          name: update-images
      - uses: git-push
        as: push
        config:
          path: ./src
          generateTargetBranch: true
      - uses: git-open-pr
        as: open-pr
        config:
          repoURL: https://github.com/pdcthanh112/CongThanhApp.git
          sourceBranch: ${{ outputs.push.branch }}
          targetBranch: main
          title: 'release(prod): freight ${{ ctx.targetFreight.name }}'
          labels:
          - release
          - kargo
      - uses: git-wait-for-pr
        config:
          repoURL: https://github.com/pdcthanh112/CongThanhApp.git
          prNumber: ${{ outputs['open-pr'].pr.id }}
  verification:
    analysisTemplates:
    - name: ecommerce-health
