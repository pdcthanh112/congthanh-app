# Kargo cần: quyền ghi repo (commit values/overlay, mở PR prod) và quyền đọc GHCR (liệt kê tag image).
# Token GitHub (fine-grained: contents + pull requests của repo; packages:read) lưu ở Vault kv/ci/kargo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git
  namespace: congthanhapp
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: kargo-git
    creationPolicy: Owner
    template:
      metadata:
        labels: {kargo.akuity.io/cred-type: git}
      data:
        repoURL: https://github.com/pdcthanh112/CongThanhApp.git
        username: kargo
        password: "{{ .token }}"
  data:
  - {secretKey: token, remoteRef: {key: ci/kargo, property: github_token}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-ghcr
  namespace: congthanhapp
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: kargo-ghcr
    creationPolicy: Owner
    template:
      metadata:
        labels: {kargo.akuity.io/cred-type: image}
      data:
        repoURL: ^ghcr\.io/pdcthanh112/congthanhapp/.+$
        repoURLIsRegex: "true"
        username: kargo
        password: "{{ .token }}"
  data:
  - {secretKey: token, remoteRef: {key: ci/kargo, property: github_token}}
