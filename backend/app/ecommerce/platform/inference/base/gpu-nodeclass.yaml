# Bottlerocket bản NVIDIA có sẵn driver + device plugin, nên không cần cài GPU operator.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  amiSelectorTerms:
  - alias: bottlerocket@latest
  role: CLUSTER-karpenter-node
  subnetSelectorTerms:
  - tags: {karpenter.sh/discovery: CLUSTER}
  securityGroupSelectorTerms:
  - tags: {karpenter.sh/discovery: CLUSTER}
  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs: {volumeSize: 4Gi, volumeType: gp3, encrypted: true}
  - deviceName: /dev/xvdb
    # Ổ dữ liệu: image vLLM (~10GB) + trọng số model tải từ Hugging Face.
    ebs: {volumeSize: 150Gi, volumeType: gp3, encrypted: true}
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1
