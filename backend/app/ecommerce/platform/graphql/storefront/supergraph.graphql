# Sinh bởi tools/scripts/compose-supergraph.mjs từ graph.yaml — không sửa tay.
schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Cart {
  """Mọi dòng đều mua được và giỏ không rỗng"""
  checkoutReady: Boolean!
  """null khi khách chưa có giỏ"""
  id: ID
  itemCount: Int!
  lines: [CartLine!]!
  """Tạm tính các dòng mua được"""
  subtotal: Money!
}

type CartLine {
  addedAt: DateTime
  id: ID!
  issue: CartLineIssue
  lineTotal: Money
  """null nếu sản phẩm đã bị xoá"""
  product: Product
  purchasable: Boolean!
  quantity: Int!
  unitPrice: Money
}

enum CartLineIssue {
  INSUFFICIENT_STOCK
  OUT_OF_STOCK
  UNAVAILABLE
}

"""Danh mục sản phẩm (cây tối đa 5 cấp)"""
type Category {
  id: ID!
  children: [Category!]!
  createdAt: DateTime!
  description: String
  image: String
  name: String!
  parent: Category
  parentId: ID
  """Breadcrumb từ gốc tới danh mục này"""
  path: [Category!]!
  slug: String!
  sortOrder: Int!
  status: CategoryStatus!
  updatedAt: DateTime!
  """Gửi kèm khi sửa để chống ghi đè (optimistic locking)"""
  version: Int!
}

input CheckoutInput {
  """Mã thiết bị (fingerprint) cho kiểm tra gian lận"""
  deviceId: String
  """
  Tổng tiền khách đang thấy; giá đổi trước khi đặt thì trả lỗi PRICE_CHANGED để khách xem lại
  """
  expectedTotal: Float
  """
  Sinh một lần cho mỗi lần bấm "Đặt hàng" (16-64 ký tự); gửi lại không tạo đơn mới
  """
  idempotencyKey: String!
  note: String
  paymentMethod: PaymentMethod!
  """
  ConfirmationToken (ctoken_...) từ Stripe Payment Element cho CARD/APPLE_PAY/GOOGLE_PAY/AFFIRM/KLARNA/AFTERPAY; bỏ trống với PayPal
  """
  paymentToken: String
  promotionCode: String
  """Bắt buộc với PayPal và trả góp: trang quay về sau khi khách duyệt thanh toán"""
  returnUrl: String
  """Bỏ trống = địa chỉ mặc định"""
  shippingAddressId: ID
}

type CheckoutProgress {
  failureReason: String
  orderCode: String!
  orderStatus: String!
  """Có khi cần chuyển khách sang cổng thanh toán"""
  paymentRedirectUrl: String
  step: String
}

type CheckoutResult {
  """Phiên checkout; poll checkoutSession(id) khi status = PENDING_REVIEW"""
  checkoutSessionId: ID!
  """Theo dõi tiến trình bằng checkoutProgress(orderCode)"""
  checkoutUrl: String
  discount: Money!
  """Lý do khi bị từ chối"""
  failureReason: String
  orderCode: String
  orderId: ID
  shippingFee: Money!
  """
  PLACED = đã tạo đơn; PENDING_REVIEW = chờ duyệt (chưa có đơn); REJECTED
  """
  status: String!
  subtotal: Money!
  tax: Money!
  total: Money!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type Money {
  amount: Float!
  """ISO 4217"""
  currency: String!
  """
  Đã định dạng theo en-US, ví dụ "$1,250.00"
  """
  formatted: String!
}

type Mutation {
  addToCart(productId: ID!, quantity: Int! = 1): Cart!
  """Huỷ đơn khi chưa giao cho vận chuyển"""
  cancelOrder(orderCode: String!, reason: String): Order!
  """
  Đặt hàng từ giỏ mặc định: báo giá lại, kiểm tra gian lận, tạo đơn (hoặc giữ lại chờ duyệt)
  """
  checkout(input: CheckoutInput!): CheckoutResult!
  clearCart: Cart!
  removeCartItem(itemId: ID!): Cart!
  """Ghi nhận khách xem sản phẩm (tín hiệu cho gợi ý)"""
  trackProductView(productId: ID!): Boolean!
  """quantity = 0 thì xoá dòng"""
  updateCartItem(itemId: ID!, quantity: Int!): Cart!
  createBrand(input: BrandInput!): Brand!
  createCategory(input: CreateCategoryInput!): Category!
  """Tạo tag (trùng tên thì trả tag đã có)"""
  createTag(name: String!): Tag!
  moveCategory(input: MoveCategoryInput!): Category!
  setCategoryActive(active: Boolean!, id: ID!, version: Int!): Category!
  """Gán toàn bộ tag cho sản phẩm; seller chỉ sửa sản phẩm của mình"""
  setProductTags(productId: ID!, tagIds: [Int!]!): [Tag!]!
  updateBrand(id: Int!, input: BrandInput!): Brand!
  updateCategory(input: UpdateCategoryInput!): Category!
  updateTag(id: Int!, name: String, status: TagStatus): Tag!
  addShippingAddress(input: AddressInput!, makeDefault: Boolean! = false): ShippingAddress!
  addToWishlist(productId: ID!): Boolean!
  clearSearchHistory: Boolean!
  deleteShippingAddress(id: ID!): Boolean!
  """Ghi từ khoá vừa tìm (storefront gọi sau khi tìm kiếm)"""
  recordSearch(keyword: String!): Boolean!
  removeFromWishlist(productId: ID!): Boolean!
  removeSearch(keyword: String!): Boolean!
  setDefaultShippingAddress(id: ID!): ShippingAddress!
  updateShippingAddress(id: ID!, input: AddressInput!): ShippingAddress!
  deleteMyReview(id: ID!): Boolean!
  editReview(id: ID!, input: EditReviewInput!, version: Int!): Review!
  """Đánh dấu "hữu ích" (mỗi người một lần)"""
  markReviewHelpful(id: ID!): Boolean!
  moderateReview(id: ID!, reason: String, status: ReviewStatus!, version: Int!): Review!
  replyToReview(id: ID!, reply: String!, version: Int!): Review!
  submitReview(input: SubmitReviewInput!): Review!
  """Số thông báo vừa đánh dấu đã đọc"""
  markNotificationsRead(
    """Bỏ trống = tất cả"""
    ids: [ID!]
  ): Int!
  registerFcmToken(platform: String! = "android", token: String!): Boolean!
  registerWebPush(subscription: WebPushInput!): Boolean!
  """CSKH/Admin gửi thông báo cho một người dùng"""
  sendNotification(input: SendNotificationInput!): Notification
  """Gỡ thiết bị khi đăng xuất"""
  unregisterDevice(fcmToken: String, webPushEndpoint: String): Boolean!
  updateNotificationPreferences(clearQuietHours: Boolean! = false, quietHours: QuietHoursInput, settings: [SettingInput!]! = []): NotificationPreferences!
  """Hỏi người bán về sản phẩm (mở hội thoại hoặc dùng lại hội thoại cũ)"""
  contactSeller(message: MessageInput!, productId: ID!): StartConversationResult!
  contactSupport(message: MessageInput!, orderId: ID): StartConversationResult!
  markConversationRead(conversationId: ID!, seq: Int!): Boolean!
  sendMessage(conversationId: ID!, message: MessageInput!): ChatMessage!
  """Báo "đang gõ" (không lưu, chỉ đẩy realtime)"""
  sendTyping(conversationId: ID!): Boolean!
}

type Order {
  cancelReason: String
  discount: Money!
  lines: [OrderLine!]!
  note: String
  orderCode: String!
  orderId: ID!
  paymentMethod: String
  placedAt: DateTime!
  promotionCode: String
  shippingAddress: OrderAddress
  status: String!
  subtotal: Money!
  total: Money!
  updatedAt: DateTime
}

type OrderAddress {
  city: String!
  country: String!
  district: String
  fullName: String!
  line1: String!
  line2: String
  phone: String!
  postalCode: String
  ward: String
}

type OrderLine {
  """Tên tại thời điểm đặt"""
  name: String!
  """null nếu sản phẩm đã bị xoá"""
  product: Product
  quantity: Int!
  sku: String
  total: Money!
  unitPrice: Money!
}

type OrderSummary {
  itemCount: Int!
  orderCode: String!
  placedAt: DateTime!
  status: String!
  total: Money!
}

enum PaymentMethod {
  AFFIRM
  AFTERPAY
  APPLE_PAY
  CARD
  GOOGLE_PAY
  KLARNA
  PAYPAL
}

"""Sản phẩm (dữ liệu gốc ở product-service)"""
type Product {
  active: Boolean!
  brandName: String
  categories: [Category!]!
  description: String
  """Phần trăm giảm so với giá gốc (0 nếu không giảm)"""
  discountPercent: Int!
  id: ID!
  images: [String!]!
  name: String!
  originalPrice: Money!
  price: Money!
  """Thường mua kèm hoặc sản phẩm tương tự"""
  recommendations(kind: RecommendationKind! = BOUGHT_TOGETHER, limit: Int! = 8): [Recommendation!]!
  sellerId: ID!
  sku: String!
  slug: String
  """null khi inventory-service tạm không trả lời"""
  stock: Stock
  thumbnail: String
  tags: [Tag!]!
  inWishlist: Boolean!
  ratingSummary: RatingSummary!
  reviews(page: Int! = 1, rating: Int, size: Int! = 10, sort: ReviewSort! = HELPFUL, withMedia: Boolean! = false): ReviewPage!
}

type ProductPage {
  items: [Product!]!
  limit: Int!
  page: Int!
  totalItems: Int!
  totalPages: Int!
}

type PromotionQuote {
  discount: Money
  reason: String
  subtotal: Money!
  total: Money!
  valid: Boolean!
}

type Query {
  """Tiến trình saga đặt hàng (poll mỗi 1-2 giây)"""
  checkoutProgress(orderCode: String!): CheckoutProgress!
  """Trạng thái phiên checkout (poll khi đơn đang chờ duyệt)"""
  checkoutSession(id: ID!): CheckoutResult!
  myCart: Cart!
  myOrders(limit: Int! = 20): [OrderSummary!]!
  order(orderCode: String!): Order!
  """Tìm theo id hoặc slug (đúng một trong hai)"""
  product(id: ID, slug: String): Product
  """Danh sách sản phẩm, lọc theo danh mục nếu có"""
  products(categoryId: ID, limit: Int! = 20, page: Int! = 1): ProductPage!
  """Thử mã giảm giá trên giỏ hiện tại"""
  quotePromotion(code: String!): PromotionQuote!
  """Gợi ý cho riêng khách (vãng lai: theo phiên, hoặc xu hướng)"""
  recommendedForYou(limit: Int! = 12): [Recommendation!]!
  """Tìm theo từ khoá (tên sản phẩm)"""
  searchProducts(keyword: String!): [Product!]!
  """Sản phẩm đang được quan tâm (7 ngày gần đây)"""
  trendingProducts(categoryId: ID, limit: Int! = 12): [Recommendation!]!
  brand(id: Int!): Brand
  brands(includeInactive: Boolean! = false): [Brand!]!
  """Danh mục con của parentId (bỏ trống = danh mục gốc)"""
  categories(includeInactive: Boolean! = false, parentId: ID): [Category!]!
  category(id: ID, slug: String): Category
  countries: [Country!]!
  country(isoCode: String!): Country
  tags(page: Int! = 1, size: Int! = 20, status: TagStatus): TagPage!
  """Khách đang đăng nhập"""
  me: Customer!
  """Backoffice: lọc đánh giá để kiểm duyệt"""
  adminReviews(page: Int! = 1, productId: ID, rating: Int, size: Int! = 20, status: ReviewStatus): ReviewPage!
  """Sản phẩm đã mua đang chờ khách đánh giá"""
  myPendingReviews(limit: Int! = 20): [PendingReview!]!
  myReviews(page: Int! = 1, size: Int! = 10): ReviewPage!
  myNotificationPreferences: NotificationPreferences!
  myNotifications(page: Int! = 1, size: Int! = 20, unreadOnly: Boolean! = false): NotificationPage!
  unreadNotificationCount: Int!
  conversation(id: ID!): Conversation!
  """Tin nhắn, mới nhất trước; cuộn lên bằng beforeSeq"""
  messages(beforeSeq: Int, conversationId: ID!, limit: Int! = 30): [ChatMessage!]!
  """Hội thoại của tôi (nhân viên hỗ trợ thấy cả hàng chờ hỗ trợ)"""
  myConversations(page: Int! = 1, size: Int! = 20): ConversationPage!
  unreadMessageCount: Int!
}

type Recommendation {
  product: Product!
  """BOUGHT_TOGETHER | SIMILAR | TRENDING | FOR_YOU"""
  reason: String!
  score: Float!
}

enum RecommendationKind {
  BOUGHT_TOGETHER
  SIMILAR
}

type Stock {
  """Số lượng còn bán được (đã trừ hàng đang giữ)"""
  available: Int!
  status: StockStatus!
}

enum StockStatus {
  BACKORDER
  DISCONTINUED
  IN_STOCK
  LOW_STOCK
  OUT_OF_STOCK
}

type Brand {
  active: Boolean!
  id: Int!
  image: String
  name: String!
  slug: String!
}

input BrandInput {
  active: Boolean
  image: String
  name: String!
  slug: String
}

enum CategoryStatus {
  ACTIVE
  INACTIVE
}

type Country {
  currencyCode: String
  currencySymbol: String
  id: Int!
  """ISO 3166-1 alpha-2"""
  isoCode: String!
  isoCode3: String
  locale: String
  name: String!
  nameOrigin: String
  phoneCode: String
  timezone: String
}

input CreateCategoryInput {
  description: String
  image: String
  name: String!
  parentId: ID
  slug: String
  sortOrder: Int
}

input MoveCategoryInput {
  id: ID!
  """null = chuyển lên gốc"""
  parentId: ID
  version: Int!
}

type Tag {
  id: Int!
  name: String!
  status: TagStatus!
}

type TagPage {
  items: [Tag!]!
  page: Int!
  size: Int!
  total: Int!
}

enum TagStatus {
  ACTIVE
  INACTIVE
}

input UpdateCategoryInput {
  description: String
  id: ID!
  image: String
  name: String!
  slug: String
  sortOrder: Int
  version: Int!
}

input AddressInput {
  addressLine: String!
  countryCode: String! = "US"
  districtCode: String
  fullName: String!
  label: AddressLabel! = HOME
  latitude: Float
  longitude: Float
  phoneNumber: String!
  postalCode: String
  provinceCode: String
  wardCode: String
}

enum AddressLabel {
  HOME
  OFFICE
  OTHER
}

type Customer {
  defaultShippingAddress: ShippingAddress
  id: ID!
  recentSearches(limit: Int! = 10): [SearchEntry!]!
  shippingAddresses: [ShippingAddress!]!
  wishlist(page: Int! = 1, size: Int! = 20): WishlistPage!
}

type SearchEntry {
  keyword: String!
  searchedAt: DateTime!
}

type ShippingAddress {
  addressLine: String!
  """ISO 3166-1 alpha-2"""
  countryCode: String!
  districtCode: String
  fullName: String!
  id: ID!
  isDefault: Boolean!
  label: AddressLabel!
  latitude: Float
  longitude: Float
  phoneNumber: String!
  postalCode: String
  provinceCode: String
  updatedAt: DateTime!
  wardCode: String
}

type WishlistItem {
  addedAt: DateTime!
  product: Product!
}

type WishlistPage {
  items: [WishlistItem!]!
  total: Int!
}

input EditReviewInput {
  content: String
  mediaUrls: [String!]! = []
  rating: Int!
  title: String
}

"""Sản phẩm đã mua chưa đánh giá"""
type PendingReview {
  orderId: ID!
  product: Product!
  purchasedAt: DateTime
}

type RatingSummary {
  average: Float!
  count: Int!
  """Số lượng theo sao, phần tử 0 = 1 sao ... 4 = 5 sao"""
  stars: [Int!]!
}

type Review {
  """Tên người viết (đã che bớt với người khác)"""
  authorName: String!
  content: String
  createdAt: DateTime!
  helpfulCount: Int!
  id: ID!
  mediaUrls: [String!]!
  """Chỉ tác giả và admin thấy"""
  moderationReason: String
  product: Product!
  rating: Int!
  repliedAt: DateTime
  sellerReply: String
  status: ReviewStatus!
  title: String
  updatedAt: DateTime!
  """Luôn true: chỉ người đã mua mới viết được"""
  verifiedPurchase: Boolean!
  version: Int!
}

type ReviewPage {
  items: [Review!]!
  total: Int!
}

enum ReviewSort {
  HELPFUL
  NEWEST
  RATING_HIGH
  RATING_LOW
}

enum ReviewStatus {
  HIDDEN
  PUBLISHED
}

input SubmitReviewInput {
  content: String
  mediaUrls: [String!]! = []
  orderId: ID!
  productId: ID!
  rating: Int!
  title: String
}

type Notification {
  body: String!
  category: NotificationCategory!
  createdAt: DateTime!
  id: ID!
  link: String
  readAt: DateTime
  title: String!
  type: String!
}

enum NotificationCategory {
  INVENTORY
  MESSAGE
  ORDER
  PAYMENT
  PROMOTION
  REVIEW
  SYSTEM
  WISHLIST
}

enum NotificationChannel {
  EMAIL
  FCM
  IN_APP
  SMS
  WEB_PUSH
}

type NotificationPage {
  items: [Notification!]!
  total: Int!
}

type NotificationPreferences {
  quietHours: QuietHours
  settings: [NotificationSetting!]!
}

type NotificationSetting {
  category: NotificationCategory!
  channel: NotificationChannel!
  """false với nhóm giao dịch (đơn hàng, thanh toán) qua in-app/email"""
  editable: Boolean!
  enabled: Boolean!
}

type QuietHours {
  end: String!
  start: String!
  timezone: String!
}

input QuietHoursInput {
  """HH:mm, có thể qua ngày"""
  end: String!
  """HH:mm"""
  start: String!
  timezone: String! = "America/New_York"
}

input SendNotificationInput {
  body: String!
  channels: [NotificationChannel!]! = [IN_APP]
  link: String
  title: String!
  userId: ID!
}

input SettingInput {
  category: NotificationCategory!
  channel: NotificationChannel!
  enabled: Boolean!
}

type Subscription {
  """Thông báo mới của người đang đăng nhập (graphql-ws qua router)"""
  notificationAdded: Notification!
  """Tin mới và trạng thái đang gõ trong mọi hội thoại của tôi"""
  chatEvents: ChatEvent!
}

input WebPushInput {
  auth: String!
  endpoint: String!
  p256dh: String!
}

"""Sự kiện realtime: tin mới (message) hoặc đang gõ (typingUserId)"""
type ChatEvent {
  conversationId: ID!
  message: ChatMessage
  typingUserId: ID
}

type ChatMessage {
  attachments: [String!]!
  body: String!
  clientMessageId: String
  conversationId: ID!
  createdAt: DateTime!
  id: ID!
  senderId: ID!
  """
  Số thứ tự tăng dần trong hội thoại (dùng cho phân trang và đánh dấu đã đọc)
  """
  seq: Int!
}

type Conversation {
  """
  Id người bán, hoặc "support"
  """
  counterpartId: ID!
  createdAt: DateTime!
  customerId: ID!
  id: ID!
  kind: ConversationKind!
  lastMessageAt: DateTime
  lastMessagePreview: String
  lastSeq: Int!
  orderId: ID
  product: Product
  """Số tin chưa đọc của người đang xem"""
  unread: Int!
}

enum ConversationKind {
  SELLER
  SUPPORT
}

type ConversationPage {
  items: [Conversation!]!
  total: Int!
}

input MessageInput {
  attachments: [String!]! = []
  body: String! = ""
  """Id do client sinh (uuid) để gửi lại không bị trùng"""
  clientMessageId: String
}

type StartConversationResult {
  conversation: Conversation!
  message: ChatMessage!
}
