# Cilium chạy chế độ chaining trên AWS VPC CNI (EKS giữ IPAM/ENI, Cilium thêm network policy eBPF + Hubble),
# cấu hình tương thích Istio Ambient: socketLB chỉ trong host namespace, không độc chiếm cấu hình CNI.
cni:
  chainingMode: aws-cni
  exclusive: false
enableIPv4Masquerade: false
routingMode: native
endpointRoutes: {enabled: true}
socketLB:
  hostNamespaceOnly: true
kubeProxyReplacement: false
# Policy chỉ ghi verdict (không chặn) cho tới khi xác nhận đủ luồng hợp lệ trên Hubble; đổi false để thực thi.
policyAuditMode: true
# Hubble: quan sát luồng mạng L3/L4/L7 theo pod/namespace (UI + metric cho Grafana).
hubble:
  enabled: true
  relay: {enabled: true}
  ui: {enabled: true}
  metrics:
    enableOpenMetrics: true
    enabled:
    - dns
    - drop
    - tcp
    - flow
    - port-distribution
    - icmp
    - "httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload"
    serviceMonitor: {enabled: true}
prometheus:
  enabled: true
  serviceMonitor: {enabled: true}
operator:
  prometheus:
    enabled: true
    serviceMonitor: {enabled: true}
