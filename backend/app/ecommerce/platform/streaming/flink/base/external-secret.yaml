# Mật khẩu KafkaUser stream-processor (SCRAM) từ Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stream-processor
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: stream-processor, creationPolicy: Owner}
  data:
  - {secretKey: KAFKA_PASSWORD, remoteRef: {key: ecommerce/stream-processor, property: kafka_password}}
