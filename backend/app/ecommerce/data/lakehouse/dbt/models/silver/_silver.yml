version: 2
models:
- name: orders
  description: Đơn hàng đã làm sạch từ ods.orders (không PII), làm mới toàn bộ mỗi lần chạy.
  columns:
  - name: order_id
    data_tests: [not_null, unique]
  - name: customer_id
    data_tests: [not_null]
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values: [PENDING, CONFIRMED, CANCELLED, FAILED, SHIPPED, DELIVERED, REFUNDED, COMPLETED]
        config: {severity: warn}
  - name: total
    data_tests: [not_null, not_negative]
  data_tests:
  - expression_is_true:
      arguments:
        expression: "total = subtotal - discount"
- name: order_lines
  columns:
  - name: order_line_id
    data_tests: [not_null, unique]
  - name: order_id
    data_tests:
    - relationships:
        arguments: {to: ref('orders'), field: order_id}
  - name: quantity
    data_tests:
    - expression_is_true:
        arguments:
          expression: "quantity > 0"
  - name: unit_price
    data_tests: [not_negative]
- name: payments
  columns:
  - name: payment_id
    data_tests: [not_null, unique]
  - name: amount
    data_tests: [not_negative]
  - name: order_id
    data_tests:
    - relationships:
        arguments: {to: ref('orders'), field: order_id}
        config: {severity: warn}  # thanh toán có thể tới trước đơn khi CDC lệch nhịp
- name: products
  columns:
  - name: product_id
    data_tests: [not_null, unique]
- name: clickstream_events
  description: Clickstream hợp lệ, khử trùng theo event_id (incremental MERGE trong cửa sổ lookback).
  columns:
  - name: event_id
    data_tests: [not_null, unique]
  - name: session_id
    data_tests: [not_null]
  - name: event_type
    data_tests:
    - accepted_values:
        arguments:
          values: [page_view, product_view, search, add_to_cart, remove_from_cart, begin_checkout, purchase]
- name: order_events
  description: Event vòng đời đơn hàng và thanh toán (outbox protobuf đã giải mã), cột có kiểu.
  columns:
  - name: event_id
    data_tests: [not_null, unique]
  - name: order_id
    data_tests: [not_null]
  - name: event_name
    data_tests:
    - accepted_values:
        arguments:
          values: [OrderPlaced, OrderConfirmed, OrderCancelled, PaymentAuthorized, PaymentFailed, PaymentRefunded]
