<header class="topbar">
  <strong>CongThanh Backoffice</strong>
  <span class="grow"></span>
  @if (auth.username(); as name) {
    <span>{{ name }}</span>
  }
  <button type="button" class="secondary" (click)="auth.logout()">Đăng xuất</button>
</header>
<main class="page">
  @if (auth.isAdmin()) {
    <nav class="tabs" aria-label="Quản trị catalog">
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
      }
    </nav>
  }
  @if (notices.notice(); as n) {
    <p class="notice" [class.error]="n.kind === 'error'" role="status">{{ n.text }}</p>
  }
  <router-outlet />
</main>
