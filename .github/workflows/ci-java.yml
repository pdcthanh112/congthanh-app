name: ci-java
on:
  pull_request:
    paths: ["backend/app/ecommerce/libs/java/**", "backend/app/ecommerce/services/{product,order,payment,promotion,checkout}-service/**", "backend/app/ecommerce/data/streaming/stream-processor/**", "backend/app/ecommerce/build-logic/**", "backend/app/ecommerce/*.gradle.kts", "backend/app/ecommerce/gradle/**", "backend/app/ecommerce/api/proto/**"]
  push:
    branches: [main]
    paths: ["backend/app/ecommerce/libs/java/**", "backend/app/ecommerce/services/{product,order,payment,promotion,checkout}-service/**", "backend/app/ecommerce/data/streaming/stream-processor/**", "backend/app/ecommerce/build-logic/**", "backend/app/ecommerce/api/proto/**"]
permissions: {contents: read}
concurrency: {group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}
defaults:
  run: {working-directory: backend/app/ecommerce}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "25"}
      - uses: gradle/actions/setup-gradle@v5
      - name: build + test (Testcontainers)
        run: ./gradlew build --scan --no-daemon
      # Spring AOT phải chạy được thì native image mới build được; bắt lỗi sớm ở PR thay vì lúc build native.
      - name: Spring AOT (kiểm tra cho GraalVM native)
        run: ./gradlew processAot --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: test-reports, path: "backend/app/ecommerce/services/*/build/reports/tests"}

  # Image bằng Jib (build-logic/congthanh.spring-service): không cần Dockerfile hay Docker daemon.
  image:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    strategy:
      matrix:
        service: [product-service, order-service, payment-service, promotion-service, checkout-service]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "25"}
      - uses: gradle/actions/setup-gradle@v5
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: build & push (Jib, không cần Docker daemon)
        id: jib
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/congthanhapp/${{ matrix.service }}
        run: |
          ./gradlew :services:${{ matrix.service }}:jib \
            -Djib.to.image=$IMAGE:${GITHUB_SHA::12} \
            -Djib.to.auth.username=${{ github.actor }} -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
          echo "image=$IMAGE@$(cat services/${{ matrix.service }}/build/jib-image.digest)" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat services/${{ matrix.service }}/build/jib-image.digest)" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@0.33.1
        with: {image-ref: "${{ steps.jib.outputs.image }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
      - run: |
          syft "${{ steps.jib.outputs.image }}" -o spdx-json > sbom.spdx.json
          cosign sign --yes "${{ steps.jib.outputs.image }}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${{ steps.jib.outputs.image }}"
      - name: SLSA provenance (GitHub artifact attestation, lưu cả vào registry)
        uses: actions/attest-build-provenance@v3
        with: {subject-name: "ghcr.io/${{ github.repository_owner }}/congthanhapp/${{ matrix.service }}", subject-digest: "${{ steps.jib.outputs.digest }}", push-to-registry: true}

  # Bản GraalVM native (tag <sha>-native) qua Paketo buildpacks; buildpack tự mang GraalVM nên runner không cần cài.
  # Helm chọn bằng runtime: java-native + image.tag tương ứng. Build lâu (~5-8 phút/service) nên chỉ chạy trên main.
  image-native:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    strategy:
      fail-fast: false
      matrix:
        service: [product-service, order-service, payment-service, promotion-service, checkout-service]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "25"}
      - uses: gradle/actions/setup-gradle@v5
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: build & push (bootBuildImage, native)
        id: native
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/congthanhapp
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export IMAGE_TAG=${GITHUB_SHA::12}
          ./gradlew :services:${{ matrix.service }}:bootBuildImage --publishImage --no-daemon
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REGISTRY/${{ matrix.service }}:$IMAGE_TAG-native")
          echo "image=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@0.33.1
        with: {image-ref: "${{ steps.native.outputs.image }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
      - run: |
          syft "${{ steps.native.outputs.image }}" -o spdx-json > sbom.spdx.json
          cosign sign --yes "${{ steps.native.outputs.image }}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${{ steps.native.outputs.image }}"
      - name: SLSA provenance (GitHub artifact attestation, lưu cả vào registry)
        uses: actions/attest-build-provenance@v3
        with: {subject-name: "ghcr.io/${{ github.repository_owner }}/congthanhapp/${{ matrix.service }}", subject-digest: "${{ steps.native.outputs.digest }}", push-to-registry: true}

  # Job Flink: image = flink:2.2-java21 + usrlib (Dockerfile), không dùng Jib vì cần base image Flink.
  image-stream-processor:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/congthanhapp/stream-processor
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend/app/ecommerce
          file: backend/app/ecommerce/data/streaming/stream-processor/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=stream-processor
          cache-to: type=gha,mode=max,scope=stream-processor
      - uses: aquasecurity/trivy-action@0.33.1
        with: {image-ref: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
      - run: |
          ref="$IMAGE@${{ steps.build.outputs.digest }}"
          syft "$ref" -o spdx-json > sbom.spdx.json
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$ref"
      - name: SLSA provenance (GitHub artifact attestation, lưu cả vào registry)
        uses: actions/attest-build-provenance@v3
        with: {subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.build.outputs.digest }}", push-to-registry: true}
